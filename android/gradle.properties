org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
org.gradle.parallel=false
# Increase network timeout to handle slow connections
org.gradle.internal.http.socketTimeout=300000
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.maxRedirects=20
# Increase file lock timeout for gradle wrapper
org.gradle.wrapper.timeout=600000
# Allow offline mode
org.gradle.offline=false

# If behind a proxy, uncomment and configure:
# systemProp.https.proxyHost=PROXY_HOST
# systemProp.https.proxyPort=PROXY_PORT
# systemProp.http.proxyHost=PROXY_HOST
# systemProp.http.proxyPort=PROXY_PORT
